<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4a66"/>
      <stop offset="1" stop-color="#05141d"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe6f2"/>
      <stop offset="1" stop-color="#2bb3cc"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- ondas de luz -->
  <path d="M0 300 C 200 250, 340 350, 512 300 S 830 250, 1024 300 L1024 0 L0 0 Z" fill="#ffffff" opacity="0.05"/>
  <!-- peixe (dentro da zona segura de 60%) -->
  <g transform="translate(512 540)">
    <path d="M-230 0 C -150 -150, 70 -170, 170 -40 L 270 -130 C 255 -60, 255 60, 270 130 L 170 40 C 70 170, -150 150, -230 0 Z" fill="url(#fish)"/>
    <circle cx="-120" cy="-30" r="26" fill="#05141d"/>
    <path d="M-30 -95 C 0 -40, 0 40, -30 95" stroke="#05141d" stroke-opacity="0.25" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>
  <!-- bolhas -->
  <circle cx="300" cy="330" r="22" fill="none" stroke="#7fe6f2" stroke-width="10" opacity="0.8"/>
  <circle cx="350" cy="250" r="14" fill="none" stroke="#7fe6f2" stroke-width="8" opacity="0.6"/>
</svg>
